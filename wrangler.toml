name = "nskorean-website"
type = "javascript"
account_id = ""
workers_dev = true
route = ""
zone_id = ""
main = "index.js"

# Cloudflare Pages 配置
pages_build_caching = true

[env.production]
name = "nskorean-website-prod"
route = "nskorean.com/*"
zone_id = ""

[build]
command = ""
cwd = "./"
watch_paths = ["*.html", "data/**/*", "admin/**/*", "auth/**/*"]

[build.upload]
format = "modules"
main = "./index.js"

# 环境变量配置
[env.production.vars]
ENVIRONMENT = "production"
API_URL = "https://api.nskorean.com"
