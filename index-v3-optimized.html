<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NSKOREAN - 全球 AI 工具导航站，汇集 50+ 最新 AI 工具，帮助您快速找到适合的 AI 解决方案">
  <meta name="keywords" content="AI工具,ChatGPT,Midjourney,AI导航,工具推荐">
  <meta property="og:title" content="NSKOREAN - 全球 AI 工具导航站">
  <meta property="og:description" content="发现和比较最好的 AI 工具">
  <meta property="og:image" content="/og-image.png">
  
  <title>NSKOREAN - 全球 AI 工具导航站</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --accent: #f093fb;
      --bg-light: #f5f7fa;
      --bg-white: #ffffff;
      --text-dark: #1a1a2e;
      --text-light: #666666;
      --border: #e0e0e0;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* 性能优化：使用 will-change */
    .animate {
      will-change: transform, opacity;
    }

    /* 导航栏 */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .search-box {
      position: relative;
      width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    /* Hero 区域 */
    .hero {
      max-width: 1400px;
      margin: 0 auto;
      padding: 4rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-light);
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 分类过滤 */
    .categories {
      max-width: 1400px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .category-list {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding: 1rem 0;
      scroll-behavior: smooth;
    }

    .category-btn {
      padding: 0.75rem 1.5rem;
      border: 2px solid var(--border);
      background: white;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .category-btn:hover,
    .category-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 工具网格 */
    .tools-grid {
      max-width: 1400px;
      margin: 3rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .tool-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
    }

    .tool-header {
      padding: 1.5rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .tool-icon {
      font-size: 2rem;
    }

    .tool-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
    }

    .tool-body {
      padding: 1.5rem;
    }

    .tool-desc {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .tool-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .tool-rating {
      color: #ffc107;
      font-weight: 600;
    }

    .tool-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: var(--bg-light);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--primary);
      font-weight: 600;
    }

    .tool-footer {
      display: flex;
      gap: 0.5rem;
    }

    .btn-sm {
      flex: 1;
      padding: 0.5rem;
      font-size: 0.85rem;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-sm:hover {
      background: var(--primary);
      color: white;
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }

      .search-box {
        width: 200px;
      }

      .tools-grid {
        grid-template-columns: 1fr;
      }

      nav {
        flex-wrap: wrap;
        gap: 1rem;
      }

      .nav-actions {
        width: 100%;
        order: 3;
      }
    }

    /* 性能优化：图片懒加载 */
    img {
      loading: lazy;
    }

    /* 性能优化：减少重排 */
    .tool-card {
      contain: layout style paint;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <header>
    <nav>
      <div class="logo">🚀 NSKOREAN</div>
      <div class="nav-actions">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索 AI 工具..." onkeyup="searchTools()">
        </div>
        <button class="btn btn-primary" onclick="openConsultModal()">咨询</button>
      </div>
    </nav>
  </header>

  <!-- Hero 区域 -->
  <section class="hero">
    <h1>发现最好的 AI 工具</h1>
    <p>汇集全球 50+ 最新 AI 工具，帮助您快速找到适合的 AI 解决方案</p>
  </section>

  <!-- 分类过滤 -->
  <section class="categories">
    <div class="category-list">
      <button class="category-btn active" onclick="filterByCategory('all')">全部</button>
      <button class="category-btn" onclick="filterByCategory('对话AI')">对话 AI</button>
      <button class="category-btn" onclick="filterByCategory('图像生成')">图像生成</button>
      <button class="category-btn" onclick="filterByCategory('文本生成')">文本生成</button>
      <button class="category-btn" onclick="filterByCategory('搜索引擎')">搜索引擎</button>
      <button class="category-btn" onclick="filterByCategory('模型平台')">模型平台</button>
    </div>
  </section>

  <!-- 工具网格 -->
  <section class="tools-grid" id="toolsGrid">
    <!-- 动态生成 -->
  </section>

  <script>
    // 工具数据
    const tools = [
      {
        id: 1,
        name: 'ChatGPT',
        icon: '🤖',
        category: '对话AI',
        description: 'OpenAI 的先进语言模型',
        rating: 4.8,
        views: 5200,
        tags: ['对话', '文本生成'],
        url: 'https://chat.openai.com'
      },
      // ... 更多工具
    ];

    // 渲染工具
    function renderTools(data) {
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = data.map(tool => `
        <div class="tool-card animate" onclick="openTool('${tool.url}')">
          <div class="tool-header">
            <div class="tool-icon">${tool.icon}</div>
            <div class="tool-title">${tool.name}</div>
          </div>
          <div class="tool-body">
            <div class="tool-desc">${tool.description}</div>
            <div class="tool-meta">
              <span class="tool-rating">⭐ ${tool.rating}</span>
              <span>${tool.views.toLocaleString()} 浏览</span>
            </div>
            <div class="tool-tags">
              ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
            <div class="tool-footer">
              <button class="btn-sm" onclick="event.stopPropagation(); openTool('${tool.url}')">访问</button>
              <button class="btn-sm" onclick="event.stopPropagation(); shareTool('${tool.name}')">分享</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 搜索工具
    function searchTools() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = tools.filter(tool => 
        tool.name.toLowerCase().includes(query) || 
        tool.description.toLowerCase().includes(query)
      );
      renderTools(filtered);
    }

    // 按分类过滤
    function filterByCategory(category) {
      const filtered = category === 'all' ? tools : tools.filter(t => t.category === category);
      renderTools(filtered);
      
      // 更新按钮状态
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    // 打开工具
    function openTool(url) {
      window.open(url, '_blank');
    }

    // 分享工具
    function shareTool(name) {
      if (navigator.share) {
        navigator.share({
          title: name,
          text: `查看这个 AI 工具：${name}`,
          url: window.location.href
        });
      } else {
        alert(`分享：${name}`);
      }
    }

    // 打开咨询模态框
    function openConsultModal() {
      alert('咨询功能即将推出');
    }

    // 初始化
    renderTools(tools);

    // 性能优化：防抖搜索
    let searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchTools(), 300);
    });
  </script>
</body>
</html>
